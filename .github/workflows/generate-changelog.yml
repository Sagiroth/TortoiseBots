name: Generate Changelog & Release

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - '.github/workflows/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Changelog & Notes
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ENDPOINT: ${{ secrets.OPENCODE_ENDPOINT }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
        run: |
          python3 tools/generate_changelog.py --write --out-notes /tmp/release_notes.md --out-delta /tmp/discord_notes.md

      - name: Commit CHANGELOG.md
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ steps.generate.outputs.release_tag }} [skip ci]"
          git push origin main

      - name: Create or Update GitHub Release
        if: steps.generate.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.generate.outputs.release_exists }}" = "true" ]; then
            echo "Release ${{ steps.generate.outputs.release_tag }} already exists. Appending release notes..."
            gh release edit "${{ steps.generate.outputs.release_tag }}" \
              --notes-file /tmp/release_notes.md
          else
            echo "Creating new release ${{ steps.generate.outputs.release_tag }}..."
            gh release create "${{ steps.generate.outputs.release_tag }}" \
              --title "${{ steps.generate.outputs.release_title }}" \
              --notes-file /tmp/release_notes.md \
              --target main
          fi

      - name: Post Changelog to Discord Thread
        if: steps.generate.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/post_discord_changelog.py \
            --notes /tmp/discord_notes.md \
            --title "${{ steps.generate.outputs.release_title }}" \
            --tag "${{ steps.generate.outputs.release_tag }}" \
            --thread-id "1542647578548772954"
