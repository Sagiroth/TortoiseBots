name: Edit Discord changelog post

# Manual fix-up for a changelog announcement the webhook already posted:
# drops every line containing `remove_text` from the message's embeds.
on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Discord message ID of the changelog post"
        required: true
      remove_text:
        description: "Lines containing this text are removed"
        required: true
      thread_id:
        description: "Changelog thread ID"
        required: false
        default: "1559276000293158953"

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Edit message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
          MESSAGE_ID: ${{ inputs.message_id }}
          REMOVE_TEXT: ${{ inputs.remove_text }}
          THREAD_ID: ${{ inputs.thread_id }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          url = os.environ["DISCORD_WEBHOOK_URL"].strip().split("?")[0]
          endpoint = f"{url}/messages/{os.environ['MESSAGE_ID']}?thread_id={os.environ['THREAD_ID']}"
          headers = {"Content-Type": "application/json", "User-Agent": "TortoiseBots-Changelog-Notifier/1.0"}

          def call(method, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(endpoint, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode() or "{}")

          message = call("GET")
          needle = os.environ["REMOVE_TEXT"]
          embeds = message.get("embeds", [])
          removed = 0
          for embed in embeds:
              lines = embed.get("description", "").split("\n")
              kept = [line for line in lines if needle not in line]
              removed += len(lines) - len(kept)
              embed["description"] = "\n".join(kept)
          if not removed:
              sys.exit("No line contains the given text; nothing edited.")
          call("PATCH", {"embeds": embeds})
          print(f"Removed {removed} line(s) from message {os.environ['MESSAGE_ID']}.")
          PY
