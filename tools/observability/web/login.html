<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Tortoise WoW Observability</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐢</text></svg>">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="glass-card" style="width: 100%; max-width: 400px; padding: 32px; margin: 20px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="font-size: 3rem; margin-bottom: 8px;">🐢</div>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: #fff;">Tortoise WoW</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Bot & Server Observability Platform</p>
    </div>

    <div id="error-box" class="glass-card" style="display: none; padding: 12px; margin-bottom: 16px; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); color: #f87171; font-size: 0.85rem; border-radius: 8px;">
    </div>

    <form id="login-form">
      <div style="margin-bottom: 16px;">
        <label for="username" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;">WoW Account Name</label>
        <input type="text" id="username" name="username" required autocomplete="username" class="btn" style="width: 100%; padding: 10px 14px; font-size: 0.95rem; text-align: left;">
      </div>

      <div style="margin-bottom: 24px;">
        <label for="password" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" class="btn" style="width: 100%; padding: 10px 14px; font-size: 0.95rem; text-align: left;">
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px 16px; font-weight: 600;">
        Sign In as Game Master
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.75rem; color: var(--text-muted);">
      Authentication verifies against <code class="mono" style="color: #a5b4fc;">tw_logon.account</code>.<br>
      Requires Game Master rank (<code class="mono">rank &gt;= 3</code>).
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/dashboard';
        } else {
          errorBox.textContent = data.error || 'Authentication failed';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'Network or server error during authentication';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In as Game Master';
      }
    });
  </script>
</body>
</html>
