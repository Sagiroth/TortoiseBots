  - id: server-bot-pool
    path: server/bot-pool.md
    category: server
    summary: How the managed pool registry works, adopting legacy accounts, and safely resetting autonomous pool characters.
  - id: server-dashboard
    path: server/dashboard.md
    category: server
    summary: Setup, architecture, Prometheus metrics, and feature guide for the real-time bot observability service.
  - id: server-run-trace
    path: server/run-trace.md
    category: server
    summary: Record what a party of bots did during one run as a bt-trace v1 JSONL file plus a per-run summary, and score it offline.

  # Developers
  - id: developers
    path: developers/README.md
