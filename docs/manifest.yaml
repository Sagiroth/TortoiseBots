bundle: TortoiseBots Knowledge Base
version: 1.0.0
format: open-knowledge-format/v1
description: >-
  Authoritative, traversable knowledge base for the TortoiseBots native module,
  documenting class AI, player controls, configuration knobs, and architecture invariants.

entrypoints:
  human_quickstart: play/getting-started.md
  features: play/features.md
  player_controls: play/commands/README.md
  class_catalog: classes/overview.md
  configuration: server/configuration.md
  observability: server/dashboard.md
  developer_architecture: developers/architecture.md

categories:
  play:
    description: "Guides, party controls, whisper commands, and dungeon tactics for players."
  world:
    description: "Living world systems: bot lifecycles, leveling, economy, and PvP/dungeon queues."
  classes:
    description: "Deep-dive documentation for all 9 playable classes, specs, and Turtle WoW content."
  server:
    description: "Installation, server configuration, settings reference, pool management, and observability."
  developers:
    description: "Architecture, strategy engine internals, host API boundary, donor lineage, and development guides."
  reference:
    description: "Authoritative machine and human reference data."

nodes:
  # Classes
  - id: classes-overview
    path: classes/overview.md
    category: classes
    summary: Summary of the nine Vanilla classes, spec detection, combat roles, and shared behaviors in TortoiseBots.
  - id: classes-warrior
    path: classes/warrior.md
    category: classes
    summary: Complete guide to Warrior bot AI, stance dancing, tanking rotations, melee DPS, shouts, and Turtle WoW custom abilities.
  - id: classes-paladin
    path: classes/paladin.md
    category: classes
    summary: Complete guide to Paladin bot AI, Holy healing, Protection tanking, Retribution DPS, blessing coordination, and Judgement upkeep.
  - id: classes-hunter
    path: classes/hunter.md
    category: classes
    summary: Complete guide to Hunter bot AI, pet management, ranged rotations, melee Survival, and Aspect of the Viper logic.
  - id: classes-rogue
    path: classes/rogue.md
    category: classes
    summary: Complete guide to Rogue bot AI, stealth openers, combo point spenders, poison application, interrupts, and dungeon threat drops.
  - id: classes-priest
    path: classes/priest.md
    category: classes
    summary: Complete guide to Priest bot AI, healing ladders, Power Word Shield rules, threat drops, Shadow DPS, and Turtle WoW custom spells.
  - id: classes-shaman
    path: classes/shaman.md
    category: classes
    summary: Complete guide to Shaman bot AI, totem sets, weapon imbues, chain heals, shocks, and Turtle WoW custom abilities.
  - id: classes-mage
    path: classes/mage.md
    category: classes
    summary: Complete guide to Mage bot AI, elemental rotations, Polymorph CC, Counterspell interrupts, conjured refreshments, and Arcane Power safety.
  - id: classes-warlock
    path: classes/warlock.md
    category: classes
    summary: Complete guide to Warlock bot AI, DoT spreading, demon summoning, Soul Shard economy, Life Tap, and custom Turtle abilities.
  - id: classes-druid
    path: classes/druid.md
    category: classes
    summary: Complete guide to Druid bot AI, shapeshifting forms, tanking, healing, DPS rotations, and Turtle WoW custom abilities.

  # Play
  - id: play-glossary
    path: play/glossary.md
    category: play
    summary: Short explanations of abbreviations and TortoiseBots terms.
  - id: play-getting-started
    path: play/getting-started.md
    category: play
    summary: How to set up your client, spawn companion bots from your own account, hire mercenaries, and adventure together.
  - id: play-features
    path: play/features.md
    category: play
    summary: Comprehensive catalog of bot features, default states, configuration toggles, and engine limits.
  - id: play-commands
    path: play/commands/README.md
    category: play
    summary: Master index of all player bot commands, permission tiers, and control channels.
  - id: play-commands-party-actions
    path: play/commands/party-actions.md
    category: play
    summary: Tactical party actions, live combat toggles, and direct movement commands for player-led parties.
  - id: play-commands-commander
    path: play/commands/commander.md
    category: play
    summary: Remote commander mode and intent commands for directing bot-only parties from anywhere.
  - id: play-commands-roster-and-hiring
    path: play/commands/roster-and-hiring.md
    category: play
    summary: Commands for managing owned alts, hiring mercenary companions, and recruiter services.
  - id: play-commands-bot-panel
    path: play/commands/bot-panel.md
    category: play
    summary: Commands for inspecting bot state, managing gear and inventory, and toggling runtime behaviors.
  - id: play-commands-whispers
    path: play/commands/whispers.md
    category: play
    summary: Direct bot delegation and command reference via chat whispers and the CLI proxy.
  - id: play-commands-addon
    path: play/commands/addon.md
    category: play
    summary: Installation, GUI features, and player transport protocol for the TortoiseBotsManager addon.
  - id: play-dungeons-and-raids
    path: play/dungeons-and-raids.md
    category: play
    summary: Field manual for clearing 5-player dungeons and raids with companion bots, covering corner pulling, CC discipline, boss tactics, wipe recovery, and loot rules.
  - id: play-dungeon-reference
    path: play/dungeon-reference.md
    category: play
    summary: Boss kill orders, creature IDs, pooled rares, and event triggers for 18 5-player dungeons in Turtle WoW.
  - id: play-dungeon-run-leader
    path: play/dungeon-run-leader.md
    category: play
    summary: The opt-in run leader (.bot run, AiPlayerbot.DungeonSelfClear) that lets a bound party clear a dungeon plan by itself, its safety rules, supported steps and the keys its doors need, and the plan tables turtle-agent's exporter fills.
  - id: play-boss-tactics
    path: play/boss-tactics.md
    category: play
    summary: The per-boss tactics table (ai_boss_tactic) and the opt-in boss tactics strategy that applies it.
  - id: play-known-limitations
    path: play/known-limitations.md
    category: play
    summary: Authoritative list of current engine boundaries, blocked features, explicit non-goals, and gameplay quirks.

  # World
  - id: world-living-world
    path: world/living-world.md
    category: world
    summary: How autonomous bots roam the world, level up, travel, gather, and manage their gear.
  - id: world-social
    path: world/social.md
    category: world
    summary: How bots greet players, form groups, create autonomous guilds, and trade items.
  - id: world-queues
    path: world/queues.md
    category: world
    summary: How bots participate in Looking for Turtles dungeon matchmaking and PvP battlegrounds.
  - id: world-economy
    path: world/economy.md
    category: world
    summary: How bots earn gold, sell loot, repair gear, and trade on the living auction house.

  # Server
  - id: server-install
