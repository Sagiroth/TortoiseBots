bundle: TortoiseBots Knowledge Base
version: 1.0.0
format: open-knowledge-format/v1
description: >-
  Authoritative, traversable knowledge base for the TortoiseBots native module,
  documenting class AI, player controls, configuration knobs, and architecture invariants.

entrypoints:
  human_quickstart: guides/getting-started.md
  player_controls: guides/player-controls.md
  class_catalog: classes/overview.md
  configuration: guides/configuration-tuning.md
  observability: guides/observability-dashboard.md
  developer_architecture: concepts/architecture-invariants.md

categories:
  classes:
    description: "Deep-dive documentation for all 9 playable classes, specs, and Turtle content."
  guides:
    description: "Practical guides for players, operators, and developers."
  concepts:
    description: "Core architectural invariants, engine mechanics, and boundaries."
  reference:
    description: "Authoritative machine and human reference data."

