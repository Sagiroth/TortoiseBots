  - id: server-settings-hiring
    path: server/settings/hiring.md
    category: server
    summary: Configuration settings for hiring bot companions, gear tiers, contracts, and recruiter world buffs.
  - id: server-settings-class-behaviour
    path: server/settings/class-behaviour.md
    category: server
    summary: Configuration flags controlling class-specific AI decisions for hunters, paladins, rogues, and warlocks.
  - id: server-settings-dungeons-raids
    path: server/settings/dungeons-raids.md
    category: server
    summary: Configuration flags for encounter mechanics, hazard avoidance, raid tactics, and creature auras.
  - id: server-settings-combat
    path: server/settings/combat.md
    category: server
    summary: Configuration thresholds for health, mana, engagement distances, casting pacing, pull rules, and strategy rotation.
  - id: server-settings-world-population
    path: server/settings/world-population.md
    category: server
    summary: Configuration settings for random bot population, level seeding, wandering, lifecycle, and social interactions.
  - id: server-settings-economy
    path: server/settings/economy.md
    category: server
    summary: Configuration settings for the simulated auction house market, vendor trips, and bot economy.
  - id: server-settings-queues
    path: server/settings/queues.md
